            "@type": "Question",
            "name": "¿Cómo trabajáis el SEO para posicionar una web o un negocio local?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Trabajamos el posicionamiento SEO combinando optimización técnica, arquitectura web, investigación de palabras clave y SEO local (como Google Business Profile y búsquedas geolocalizadas). El objetivo es que tu página aparezca cuando clientes potenciales busquen tus servicios en Google y en mapas, captando tráfico orgánico cualificado sin depender únicamente de anuncios de pago."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cuánto tardan en notarse los resultados del SEO y del marketing digital?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "El SEO es una estrategia a medio plazo: los primeros avances técnicos y de visibilidad suelen notarse entre los 3 y 6 meses, con una evolución más sólida a partir del sexto mes según tu sector, autoridad del dominio y competencia. En cambio, las mejoras de conversión en la web, la captación directa o las campañas activas pueden generar movimiento mucho antes, dependiendo del punto de partida de tu proyecto."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué pasa si ya tengo dominio y hosting, o si todavía no tengo ninguno?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Si ya cuentas con dominio y hosting, auditamos su estado, velocidad y seguridad para trabajar sobre ellos o migrarlos sin interrupciones; si aún no tienes nada, te orientamos para registrar el dominio adecuado y elegir un alojamiento web fiable y rápido. En todos los casos, el dominio y los accesos principales de tu proyecto permanecen bajo el control de tu negocio."
            }
          },
          {
            "@type": "Question",
            "name": "¿Puedo rediseñar mi marca sin perder mi identidad ni el posicionamiento actual?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, un rediseño de marca bien planteado moderniza la identidad visual, mejora la coherencia en web y redes sociales y refuerza la percepción de valor sin borrar lo que ya funciona. Cuando también se renueva la web, cuidamos la estructura de contenidos, los metadatos y las redirecciones para proteger el posicionamiento SEO que ya hayas conseguido."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué ocurre si ya tengo una página web pero no atrae clientes ni convierte?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Analizamos qué está frenando los resultados: problemas de velocidad de carga, estructura confusa, falta de enfoque SEO, diseño anticuado o llamados a la acción poco claros. A partir de ese diagnóstico, podemos optimizar la web actual o plantear un rediseño estratégico orientado a que las visitas se conviertan en consultas, reservas o ventas reales."
            }
          },
          {
            "@type": "Question",
            "name": "¿Necesito contratar diseño web, SEO y social media juntos o puedo empezar por etapas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Puedes empezar por la prioridad más urgente de tu negocio y escalar después, aunque conectar diseño web, SEO y contenido en redes sociales suele dar mejores resultados a largo plazo. De este modo, tu identidad visual, tu buscador y tus canales sociales cuentan el mismo mensaje y empujan hacia el mismo objetivo comercial."
            }
          },
          {
            "@type": "Question",
            "name": "¿Ofrecéis mantenimiento, actualizaciones y soporte después del lanzamiento?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, contamos con opciones de soporte y seguimiento para mantener tu web actualizada, segura y con buen rendimiento técnico, además de acompañar la evolución de tus contenidos o campañas. Así evitas caídas, plugins desactualizados o páginas que se quedan estáticas tras el lanzamiento."
            }
          },
